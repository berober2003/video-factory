<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Film Series Player</title>
<!--
  Double-buffered chained-film player.

  Two stacked <video> elements: the hidden one preloads the next film; on
  `ended`, visibility swaps with a short opacity cross and the following film
  is staged. Cuts are gapless because every film starts and ends on a
  chrome-only frame (see src/series/shared.tsx → filmEnvelope).

  To use: set BASE to the folder holding your mp4s, list your FILMS in order,
  and adjust the CSS variables to your series palette.
-->
<style>
  :root {
    --bg: #1B1815; --soft: #A89E93; --accent: #D08A4A; --line: #3D372F;
  }
  body { margin: 0; background: var(--bg); font-family: Inter, system-ui, sans-serif; }
  .wrap { max-width: 1060px; margin: 40px auto; padding: 0 24px; }
  .vidframe { position: relative; width: 100%; aspect-ratio: 16/9; border-radius: 14px; overflow: hidden; border: 1px solid var(--line); background: var(--bg); }
  .vidframe video { position: absolute; inset: 0; display: block; width: 100%; height: 100%; transition: opacity .3s ease; }
  .vidframe video.hidden { opacity: 0; pointer-events: none; }
  .filmrail { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 18px; }
  .filmrail button {
    font: 600 12px/1 Inter, sans-serif; letter-spacing: .1em; padding: 9px 14px;
    border-radius: 99px; border: 1.5px solid var(--line); background: transparent;
    color: var(--soft); cursor: pointer; transition: all .15s ease;
  }
  .filmrail button:hover { border-color: var(--accent); color: var(--accent); }
  .filmrail button.active { border-color: var(--accent); background: var(--accent); color: var(--bg); }
</style>
</head>
<body>
<div class="wrap">
  <div class="vidframe">
    <video id="filmA" autoplay muted playsinline preload="auto" aria-label="Chained film series"></video>
    <video id="filmB" muted playsinline preload="auto" class="hidden" aria-hidden="true"></video>
  </div>
  <div class="filmrail" id="filmrail" role="tablist" aria-label="Stages"></div>
</div>

<script>
  const BASE = "./";
  const FILMS = [
    { file: "DemoSignal.mp4", label: "01 SIGNAL" },
    { file: "DemoTriage.mp4", label: "02 TRIAGE" },
    { file: "DemoShip.mp4", label: "03 SHIP" },
  ];
  const vids = [document.getElementById("filmA"), document.getElementById("filmB")];
  const rail = document.getElementById("filmrail");
  let idx = 0, front = 0;

  FILMS.forEach((f, i) => {
    const b = document.createElement("button");
    b.textContent = f.label;
    b.setAttribute("role", "tab");
    b.addEventListener("click", () => show(i, true));
    rail.appendChild(b);
  });
  const buttons = [...rail.children];

  function markActive(i) {
    buttons.forEach((b, k) => b.classList.toggle("active", k === i));
  }
  function preloadNext(i) {
    const back = vids[1 - front];
    back.src = BASE + FILMS[(i + 1) % FILMS.length].file;
    back.load();
  }
  function show(i, user) {
    idx = i;
    const back = vids[1 - front];
    const target = BASE + FILMS[i].file;
    if (!back.src.endsWith(FILMS[i].file)) { back.src = target; back.load(); }
    back.currentTime = 0;
    const p = back.play();
    if (p) p.catch(() => {});
    back.classList.remove("hidden");
    vids[front].classList.add("hidden");
    front = 1 - front;
    markActive(i);
    setTimeout(() => preloadNext(i), 400);
  }
  vids.forEach((v) => v.addEventListener("ended", () => show((idx + 1) % FILMS.length, false)));

  vids[front].src = BASE + FILMS[0].file;
  const boot = vids[front].play();
  if (boot) boot.catch(() => {});
  markActive(0);
  setTimeout(() => preloadNext(0), 600);
</script>
</body>
</html>
